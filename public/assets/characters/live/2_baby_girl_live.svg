<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 430" width="380" height="430">
  <style>
.eye { transform-box: fill-box; transform-origin: center; animation: blink 3.6s ease-in-out infinite; }
.eye:nth-of-type(2) { animation-delay: .16s; }
.arm, .hand { transform-box: fill-box; transform-origin: center; }
.wave-left { animation: wave-left 1.9s ease-in-out infinite; }
.wave-right { animation: wave-right 2.2s ease-in-out infinite; }
.leg { transform-box: fill-box; transform-origin: center; }
.kick-left { animation: kick-left 1.55s ease-in-out infinite; }
.kick-right { animation: kick-right 1.8s ease-in-out infinite; }
.wing { transform-box: fill-box; transform-origin: center; }
.flap-left { animation: flap-left .8s ease-in-out infinite; }
.flap-right { animation: flap-right .8s ease-in-out infinite .12s; }
.tail { transform-box: fill-box; transform-origin: center; animation: tail-sway 1.3s ease-in-out infinite; }
.foot { transform-box: fill-box; transform-origin: center; animation: foot-tap .7s ease-in-out infinite; }
@keyframes blink { 0%, 43%, 47%, 100% { transform: scaleY(1); } 45% { transform: scaleY(.08); } }
@keyframes wave-left { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-10deg); } }
@keyframes wave-right { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(10deg); } }
@keyframes kick-left { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-5deg); } }
@keyframes kick-right { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(5deg); } }
@keyframes flap-left { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-12deg); } }
@keyframes flap-right { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(12deg); } }
@keyframes tail-sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(5deg); } }
@keyframes foot-tap { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
</style>
